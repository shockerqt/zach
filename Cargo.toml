[package]
name = "zach"
version = "0.1.0"
edition = "2024"
default-run = "zach"
description = "Restricted GitHub-mediated workspace control agent"
license = "MIT"

[dependencies]
subtle = { version = "=2.6.1", default-features = false }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
httparse = "1.10.1"
