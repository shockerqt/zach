name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native SQLite linker dependency
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: make test
      - run: cargo build --locked
      - run: cargo build --release --locked --bin zach
      - name: Verify ELF64 AArch64 release binary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path("target/release/zach").read_bytes()[:20]
          if len(header) < 20 or header[:6] != b"\x7fELF\x02\x01":
              raise SystemExit("target/release/zach is not little-endian ELF64")
          machine = int.from_bytes(header[18:20], "little")
          if machine != 183:
              raise SystemExit(f"Expected ELF e_machine=183 (aarch64), got {machine}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zach-bin-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/release/zach
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run check
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - name: Stamp frontend artifact provenance
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const sourceSha = process.env.SOURCE_SHA;
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!sourceSha || !/^[0-9a-f]{40}$/.test(sourceSha) || sourceSha !== head) {
            throw new Error('Frontend artifact source SHA must match the checked-out HEAD');
          }
          writeFileSync('web/dist/release.json', JSON.stringify({ schema_version: 1, source_sha: sourceSha }) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: zach-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 30

  package:
    needs: [check, frontend]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zach-bin-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist-bin
      - uses: actions/download-artifact@v4
        with:
          name: zach-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/dist
      - name: Package deterministic release archive
        env:
          ZACH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ZACH_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/delivery/package-release.py \
            --binary dist-bin/zach \
            --web-dist web/dist \
            --source-sha "$ZACH_SOURCE_SHA" \
            --build-run-id "$ZACH_BUILD_RUN_ID" \
            --output-dir dist-release
          (cd dist-release && sha256sum --check release.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: zach-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist-release/zach-release.tar.gz
            dist-release/release.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: zach-release-digest-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist-release/release.sha256
          if-no-files-found: error
          retention-days: 30
