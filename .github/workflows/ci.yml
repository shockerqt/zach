name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --locked
      - name: Audit known integrated Governance task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          receipt="$(cargo run --quiet --locked -- governance.audit-task-integration --task-id GOV-042 --request-id ci-gov-042)"
          printf '%s\n' "$receipt" | grep -q '"pull_request_merged":true'
          printf '%s\n' "$receipt" | grep -q '"implementation_represented":true'
          printf '%s\n' "$receipt" | grep -q '"conclusion":"success"'
