name: zach-001-format-candidate

on:
  push:
    branches: [task/ZACH-001-build-workspace-control-agent]

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply reviewed lint remediations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rewrite(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old!r}")
              p.write_text(text.replace(old, new, count))

          rewrite('src/ledger/json.rs', 'for chunk in message.chunks_exact(64) {', 'for chunk in message.as_chunks::<64>().0 {')

          rewrite('src/ledger/validator.rs',
              'use super::json::{Json, jcs, object_bool, object_get, object_string, sha256_hex};',
              'use super::json::{Json, object_bool, object_get, object_string};')
          rewrite('src/ledger/validator.rs', 'use std::ffi::OsStr;\n', '')
          rewrite('src/ledger/validator.rs', 'pub(super) trait LedgerValidator: Send + Sync {', 'pub(crate) trait LedgerValidator: Send + Sync {')
          rewrite('src/ledger/validator.rs', 'for chunk in message.chunks_exact(64) {', 'for chunk in message.as_chunks::<64>().0 {')
          rewrite('src/ledger/validator.rs',
              'mod tests {\n    use super::*;\n',
              'mod tests {\n    use super::*;\n    use super::super::json::{jcs, sha256_hex};\n')

          rewrite('src/ledger/publisher.rs', 'pub(super) struct TrustedReceiptAuth {', 'pub(crate) struct TrustedReceiptAuth {')
          rewrite('src/ledger/publisher.rs', 'pub(super) trait ReceiptPublisher: Send + Sync {', 'pub(crate) trait ReceiptPublisher: Send + Sync {')
          rewrite('src/ledger/publisher.rs', '    UserToken(String),', '    #[allow(dead_code)] // Deliberate negative credential class for the App-only authorship boundary.\n    UserToken(String),')

          rewrite('src/ledger/store.rs',
              '''        if let Some((request_id, digest, issue)) = self.delivery(input.delivery_id)? {\n            if request_id != input.request_id\n                || digest != input.request_digest\n                || issue != input.issue_number\n            {\n                return Ok(Claim::DeliveryConflict);\n            }\n        }''',
              '''        if let Some((request_id, digest, issue)) = self.delivery(input.delivery_id)?\n            && (request_id != input.request_id\n                || digest != input.request_digest\n                || issue != input.issue_number)\n        {\n            return Ok(Claim::DeliveryConflict);\n        }''')

          rewrite('src/ledger/mod.rs',
              'use json::{Json, hmac_sha256_hex, jcs, object_get, object_string, object_u64, sha256_hex, verify_github_signature};',
              'use json::{Json, jcs, object_get, object_string, object_u64, sha256_hex, verify_github_signature};')
          rewrite('src/ledger/mod.rs', 'use std::fs;\n', '')
          rewrite('src/ledger/mod.rs', 'use std::path::{Path, PathBuf};', 'use std::path::PathBuf;')
          rewrite('src/ledger/mod.rs',
              '    PinnedGovernanceValidator, TRUSTED_CONTRACT_REVISION, enforce_result_limits,',
              '    PinnedGovernanceValidator, enforce_result_limits,')
          rewrite('src/ledger/mod.rs',
              '    fn publish_terminal(\n        &self,\n        store: &mut SqliteStore,',
              '    #[allow(clippy::too_many_arguments)] // Private orchestration helper keeps terminal/outbox identities explicit.\n    fn publish_terminal(\n        &self,\n        store: &mut SqliteStore,')
          rewrite('src/ledger/mod.rs',
              '        terminal_receipt: String,\n        terminal_result_id: String,\n        replayed: bool,',
              '        terminal_receipt: String,\n        _terminal_result_id: String,\n        replayed: bool,')
          rewrite('src/ledger/mod.rs',
              'mod tests {\n    use super::*;\n',
              'mod tests {\n    use super::*;\n    use super::json::hmac_sha256_hex;\n    use super::validator::TRUSTED_CONTRACT_REVISION;\n    use std::fs;\n    use std::path::Path;\n')

          main = Path('src/main.rs')
          text = main.read_text()
          diagnostic = '''#[allow(\n    dead_code,\n    unused_imports,\n    unused_variables,\n    private_interfaces,\n    private_bounds,\n    clippy::chunks_exact_to_as_chunks,\n    clippy::collapsible_if,\n    clippy::too_many_arguments\n)]\n#[rustfmt::skip]\nmod ledger;'''
          if diagnostic not in text:
              raise SystemExit('src/main.rs: diagnostic module attributes missing')
          text = text.replace(diagnostic, 'mod ledger;', 1)
          old = '        "governance.validate-ledger" => run_ledger_validator(&config),'
          new = '        operation if ledger::PUBLIC_WEBHOOK_OPERATIONS.contains(&operation) => run_ledger_validator(&config),'
          if old not in text:
              raise SystemExit('src/main.rs: validator command arm missing')
          text = text.replace(old, new, 1)
          old = '    println!("       zach governance.validate-ledger");'
          new = '    println!("       zach {}", ledger::PUBLIC_WEBHOOK_OPERATIONS[0]);'
          if old not in text:
              raise SystemExit('src/main.rs: validator help line missing')
          main.write_text(text.replace(old, new, 1))
          PY
      - name: Format final candidate
        run: cargo fmt
      - name: Clippy final candidate
        run: cargo clippy -- -D warnings
      - name: Test final candidate
        run: cargo test
      - name: Build final candidate
        run: cargo build --locked
      - name: Publish candidate Git tree object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com/repos/' + repo

          def request(path, payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=data, method='POST', headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD', '--', 'src'], text=True).splitlines()
          if not paths:
              raise SystemExit('formatter produced no source changes')
          entries = []
          for path in sorted(paths):
              content = base64.b64encode(open(path, 'rb').read()).decode()
              blob = request('/git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = request('/git/trees', {'base_tree': base_tree, 'tree': entries})
          print('CANDIDATE_TREE_SHA=' + tree['sha'])
          print('CANDIDATE_PATHS=' + ','.join(sorted(paths)))
          PY
